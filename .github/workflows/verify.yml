name: GYM-2026 quality gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym-local-dev
          POSTGRES_DB: gym
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://gym:gym-local-dev@localhost:5432/gym
      TEST_DATABASE_URL: postgres://gym:gym-local-dev@localhost:5432/gym
      AUTH_SECRET: ci-only-not-a-real-secret
      NODE_ENV: test
      VITEST_MAX_FORKS: "1"
      VITEST_MIN_FORKS: "1"
      VITEST_MAX_THREADS: "1"
      VITEST_MIN_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version` here: package.json declares packageManager (pnpm@9.15.0),
        # and pnpm/action-setup errors out if both are set (ERR_PNPM_BAD_PM_VERSION).
      - name: Prepare integration database
        run: |
          set -euo pipefail
          : "${TEST_DATABASE_URL:?TEST_DATABASE_URL requerida para integración}"
          pnpm install --frozen-lockfile
          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:migrate
      - name: Run complete quality gate
        run: ./scripts/verify.sh
      - name: Install E2E browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production E2E flows
        run: pnpm test:e2e
